services:
  - type: web
    name: ridex
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PAYMENT_MODE
        value: demo
      - key: PAYMENT_MERCHANT_NAME
        value: RideX Rentals
      - key: PAYMENT_UPI_ID
        sync: false
